appId: com.whisperio.app
productName: Whisperio
# whisperio:// links (CFBundleURLTypes on macOS, registry entry via the NSIS installer on Windows)
protocols:
  - name: Whisperio
    schemes:
      - whisperio
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
asarUnpack:
  - "node_modules/koffi/**"
  # EXPERIMENTAL Parakeet (#47): sherpa-onnx native addon + per-platform binary packages
  - "node_modules/sherpa-onnx-node/**"
  - "node_modules/sherpa-onnx-*/**"
  # active-win: macOS execFile()s its Swift helper `main` and Windows loads a N-API .node via
  # node-pre-gyp; neither can run from inside app.asar, so unpack both explicitly instead of
  # relying on smart-unpack heuristics.
  - "node_modules/active-win/main"
  - "node_modules/active-win/lib/binding/**"
extraResources:
  - from: icons/whisperio.ico
    to: icons/whisperio.ico
  - from: icons/whisperio.png
    to: icons/whisperio.png
publish:
  provider: github
  owner: draenger
  repo: whisperio

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Authenticode: CI (GitHub-hosted runners) has no cert and builds UNSIGNED installers.
  # The release cert lives only in Daniel's CurrentUser\My store, so signing happens locally via
  # `npm run build:win:signed` (adds certificateSha1 + sha256 on the command line; see
  # docs/release-runbook.md "Signed Windows release"). publisherName = the cert subject CN and is
  # written into app-update.yml; the in-app verifier (src/main/updateSignature) pins the thumbprint.
  signtoolOptions:
    publisherName: Jarvis (Daniel Kasprzyk)
    # Only used when a cert is given (build:win:signed); the CLI can't pass an array (string fails validation).
    signingHashAlgorithms:
      - sha256
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # No spaces — GitHub rewrites spaces to dots in asset names, which breaks the
  # filename match in latest.yml and makes auto-update 404 ("exec not found").
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  icon: build/icon.png
  # Custom entitlements: the electron-builder default omits the microphone entitlement,
  # which the hardened runtime requires. Without it getUserMedia returns a SILENT stream
  # (no prompt, no error) so recordings are empty and every transcription comes back "".
  # The inherit file carries the mic entitlement into Chromium's audio child process.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # System-audio capture (getDisplayMedia audio: 'loopback', src/main/index.ts): the usage string
  # is required if/when Chromium uses the CoreAudio-tap loopback path (macOS 14.2+); harmless otherwise.
  # The mic string replaces Electron's generic default prompt text.
  extendInfo:
    NSMicrophoneUsageDescription: Whisperio uses the microphone only while you dictate, to transcribe your speech with the provider you chose.
    NSAudioCaptureUsageDescription: Whisperio records system audio only while you use the system-audio recording hotkey, to transcribe it with the provider you chose.
  # Sign with Developer ID + notarize so macOS auto-update validates (Squirrel.Mac
  # rejects ad-hoc/unsigned updates). Credentials come from CI env / GitHub Secrets;
  # the Team ID is passed via the APPLE_TEAM_ID env var (electron-builder deprecated
  # notarize.teamId). The CI mac job has a hard timeout so a hung Apple notary
  # can't burn minutes.
  notarize: true
  target:
    # zip is REQUIRED for auto-update on macOS (Squirrel.Mac can't update from a .dmg).
    # latest-mac.yml then references the zip and electron-updater downloads it.
    - target: zip
      arch:
        - x64
        - arm64
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  icon: icons/whisperio.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Utility
