name: Build & Release

on:
  push:
    branches: [release]
  # Dry run (test + build + smoke test); the release job is push-only so a dispatch never creates a draft.
  workflow_dispatch:

permissions:
  contents: write

# A newer push to `release` cancels an in-progress run for the same ref — no
# duplicate builds piling up on the single self-hosted PC runner.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate (runs on the PC's self-hosted Linux runner; GitHub-hosted runners are not used). Typecheck + tests with coverage thresholds.
  # The expensive build matrix only runs if this passes, so broken code never
  # reaches the build runners.
  test:
    runs-on: [self-hosted, pc]
    timeout-minutes: 28  # +10: CI gate wait counts here
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:coverage

      # P0.1 click-test harness (Playwright for Electron, desktop/e2e/*.spec.ts).
      # This is a REAL gate, not advisory (continue-on-error stays false): it
      # was measured locally at ~1s to build + ~2-3s to run all 3 specs
      # end-to-end, and every spec is deliberately network-free (aiProvider
      # pinned to 'local'/no configured key so provider selection never
      # leaves the machine — see e2e/recordings-cleanup-failsoft.spec.ts) so
      # there's no CI-only flakiness source to buy down with continue-on-error.
      # `xvfb-run` gives Electron a virtual X display (no GPU/X11 on the
      # runner) — libs installed by the step above.
      - name: Install Electron runtime libs + xvfb
        shell: bash
        run: |
          # Self-hosted Linux runner container (Ubuntu 24.04) ships no Electron/GTK libs and no X display.
          # Guarded by dpkg -s so reruns on the persistent container are a no-op.
          PKGS="xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libatk1.0-0t64 libdrm2 libxkbcommon0 libsecret-1-0 libcups2t64"
          MISSING=""
          for p in $PKGS; do dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"; done
          if [ -n "$MISSING" ]; then
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
            export DEBIAN_FRONTEND=noninteractive
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends $MISSING
          fi
          command -v xvfb-run

      - name: E2E click tests (Electron, headless via xvfb)
        timeout-minutes: 5
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Daniel's PC runner (no `pc` label on purpose). VS 2022 + VS 2026 are installed there;
          # node-gyp 9 (active-win rebuild) only finds VS 2022, pinned via GYP_MSVS_VERSION below.
          - os: [self-hosted, windows, desktop-sign]
            platform: win
            timeout: 30
          - os: [self-hosted, pc]
            platform: linux
            timeout: 25

    runs-on: ${{ matrix.os }}
    # Hard cap per platform so a hung build auto-kills.
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      GYP_MSVS_VERSION: "2022"
      npm_config_msvs_version: "2022"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # node-gyp 9 (active-win rebuild) imports distutils, removed in Python 3.12. The PC runner has
      # Python 3.12 + setuptools (provides distutils). actions/setup-python is NOT used: its installer needs admin.
      - name: Check python distutils (node-gyp)
        if: matrix.platform == 'win'
        run: python -c "import distutils; print('distutils OK')"

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Install Electron runtime libs + xvfb (Linux smoke test)
        shell: bash
        run: |
          # Self-hosted Linux runner container (Ubuntu 24.04) ships no Electron/GTK libs and no X display.
          # Guarded by dpkg -s so reruns on the persistent container are a no-op.
          PKGS="xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libatk1.0-0t64 libdrm2 libxkbcommon0 libsecret-1-0 libcups2t64"
          MISSING=""
          for p in $PKGS; do dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"; done
          if [ -n "$MISSING" ]; then
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
            export DEBIAN_FRONTEND=noninteractive
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends $MISSING
          fi
          command -v xvfb-run
        if: matrix.platform == 'linux'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build

      - name: Package installer
        # --publish never: the release job below uploads from artifacts. Without it electron-builder's CI default
        # (onTagOrDraft) would push the unsigned Windows exe + latest.yml into an existing draft and overwrite the
        # locally signed assets (docs/release-runbook.md 1.4).
        run: npx electron-builder --${{ matrix.platform }} --config ../.devops/electron-builder.yml --publish never
      # Real gate (not just "it compiled"): launch the freshly built AppImage
      # headlessly and confirm the app process survives a few seconds without
      # crashing. Catches missing shared libs / runtime startup crashes that a
      # pure electron-builder packaging step can't. The whole thing is wrapped in `timeout 60` so it can never hang the runner.
      - name: Smoke test (Linux launch)
        if: matrix.platform == 'linux'
        # working-directory is already `desktop`, so dist/*.AppImage resolves here.
        env:
          # No FUSE / no GPU sandbox available on the runner.
          ELECTRON_DISABLE_SANDBOX: "1"
        run: |
          set -euo pipefail

          # Locate the AppImage electron-builder just produced.
          APPIMAGE=$(ls dist/*.AppImage 2>/dev/null | head -n1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::No AppImage found in desktop/dist — smoke test cannot run"
            ls -la dist || true
            exit 1
          fi
          echo "Smoke-testing: $APPIMAGE"
          chmod +x "$APPIMAGE"

          LOG="$RUNNER_TEMP/smoke.log"

          # --appimage-extract-and-run: no FUSE on CI runners.
          # --no-sandbox: Chromium sandbox needs privileges the runner lacks.
          # `timeout 60` is a hard ceiling so a wedged app can't burn minutes.
          # Launch in the background under a virtual display, then check liveness.
          set +e
          timeout 60 xvfb-run -a "$APPIMAGE" --appimage-extract-and-run --no-sandbox \
            >"$LOG" 2>&1 &
          APP_PID=$!

          # Give it time to fully initialize (or crash on startup).
          sleep 12

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App is still running after startup window — launch OK."
            # Clean shutdown of the launcher (and any children it spawned).
            kill "$APP_PID" 2>/dev/null
            wait "$APP_PID" 2>/dev/null
            echo "----- app output (tail) -----"
            tail -n 50 "$LOG" || true
            exit 0
          fi

          # Process died early — that's a real launch failure. Surface diagnostics.
          wait "$APP_PID"
          EXIT_CODE=$?
          echo "::error::AppImage crashed on launch (exit code: $EXIT_CODE)"
          echo "----- app output -----"
          cat "$LOG" || true
          exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Whisperio-${{ matrix.platform }}-${{ steps.version.outputs.version }}
          # upload-artifact paths are relative to the workspace root, not the job's
          # working-directory — so they're prefixed with desktop/.
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: [self-hosted, pc]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Whisperio v${{ steps.version.outputs.version }}
          # DRAFT, and no Windows installer / latest.yml: CI cannot sign Windows builds, and installed
          # apps auto-update from latest.yml. The signed .exe + latest.yml are uploaded from
          # Daniel's PC, then the draft is published (docs/release-runbook.md section 1.4).
          draft: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/latest-linux.yml
          generate_release_notes: true
