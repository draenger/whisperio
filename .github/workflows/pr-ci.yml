name: pr-ci

# Linux test proof on the PC's self-hosted runner (GitHub-hosted runners are unavailable).
# whisperio has Pull Requests DISABLED and bees push branches, so the gate runs on every branch push
# (except main/release). The pull_request trigger is kept in case PRs are ever enabled.
# Desktop only: android/ (Gradle + SDK) and mobile/ (iOS) are not run here - they need an SDK/emulator or a Mac.
on:
  push:
    branches-ignore: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: [self-hosted, pc]
    timeout-minutes: 35  # +10 min: the PC-wide CI gate (job hook) may queue the job, and that wait counts here
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Electron runtime libs + xvfb
        shell: bash
        run: |
          # Self-hosted Linux runner container (Ubuntu 24.04) ships no Electron/GTK libs and no X display.
          # Guarded by dpkg -s so reruns on the persistent container are a no-op.
          PKGS="xvfb libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libatk-bridge2.0-0t64 libatk1.0-0t64 libdrm2 libxkbcommon0 libsecret-1-0 libcups2t64"
          MISSING=""
          for p in $PKGS; do dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"; done
          if [ -n "$MISSING" ]; then
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO=sudo
            export DEBIAN_FRONTEND=noninteractive
            $SUDO apt-get update
            $SUDO apt-get install -y --no-install-recommends $MISSING
          fi
          command -v xvfb-run

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:coverage

      - name: E2E click tests (Electron, headless via xvfb)
        timeout-minutes: 5
        env:
          ELECTRON_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7
